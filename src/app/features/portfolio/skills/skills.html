<section id="skills" class="skills" aria-labelledby="skills-title">
  <div class="skills__container">
    <app-section-title
      title="Skills"
      description="Tecnologías y herramientas que uso habitualmente."
    />

    <div class="skills__groups">
      @for (group of skillGroups(); track group.category) {
        <div class="skills__group">
          <h3 class="skills__group-title">{{ group.label }}</h3>
          <ul class="skills__list">
            @for (skill of group.skills; track skill.id) {
              <li>
                <app-badge [label]="skill.name" />
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
