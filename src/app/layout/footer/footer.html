<footer class="footer">
  <div class="footer__container">
    <p class="footer__copy">© {{ currentYear }} Adrián Álvarez Jiménez</p>

    <ul class="footer__links">
      @for (link of socialLinks(); track link.id) {
        <li>
          <a
            [href]="link.url"
            [target]="link.platform === 'email' ? null : '_blank'"
            [rel]="link.platform === 'email' ? null : 'noopener'"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </div>
</footer>
